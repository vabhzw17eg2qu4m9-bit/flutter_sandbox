name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly security scan catch-up (PRs/pushes cover most analysis).
    - cron: '37 5 * * *'

jobs:
  analyze:
    name: Analyze (dart)
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: github/codeql-action/init@v3
        with:
          languages: dart

      - uses: github/codeql-action/analyze@v3
